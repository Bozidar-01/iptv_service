; Provider playlists can be large: allow 50 MB uploads and give imports room
upload_max_filesize = 60M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120
expose_php = Off

opcache.enable = 1
; Dev: pick up code changes from the bind mount immediately
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
