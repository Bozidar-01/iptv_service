# Lets nginx pass provider streams on to viewers (STREAM_PROXY=nginx, docs/features/playlist-and-streaming.md).
#
# PHP checks the viewer's access and answers with "X-Accel-Redirect: /_proxy" and the provider address
# in X-Proxy-Target. nginx then fetches that address and streams it to the viewer, so no PHP worker
# is held for the length of the viewing. These locations are `internal`: they can't be requested directly.
#
# Include this file inside the `server` block. Needs a `resolver` that works from this server
# (Docker's is 127.0.0.11; on a normal server use your DNS server or 1.1.1.1).

# Needed to follow more than one redirect (each hop is an error_page)
recursive_error_pages on;

location /_proxy {
    internal;
    resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;

    # These must be read now: after the request goes upstream, $upstream_http_* is the provider's
    set $proxy_target $upstream_http_x_proxy_target;
    set $proxy_ua $upstream_http_x_proxy_user_agent;
    set $proxy_referer $upstream_http_x_proxy_referer;

    if ($proxy_target ~ ^(https?://[^/]+)) { set $proxy_origin $1; }

    proxy_pass $proxy_target;
    include /etc/nginx/stream-proxy-common.conf;
    error_page 301 302 303 307 308 = @proxy_follow_1;
    error_page 400 401 402 403 404 405 406 408 410 429 500 501 502 503 504 = @proxy_failed;
}

# Providers often redirect to a server that carries the stream; follow up to three redirects
location @proxy_follow_1 {
    resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;
    # The redirect may be relative ("/live.ts?x=1"): add the address of the server that sent it
    set $proxy_target $upstream_http_location;
    if ($proxy_target ~ ^/) { set $proxy_target $proxy_origin$proxy_target; }
    if ($proxy_target ~ ^(https?://[^/]+)) { set $proxy_origin $1; }
    proxy_pass $proxy_target;
    include /etc/nginx/stream-proxy-common.conf;
    error_page 301 302 303 307 308 = @proxy_follow_2;
    error_page 400 401 402 403 404 405 406 408 410 429 500 501 502 503 504 = @proxy_failed;
}

location @proxy_follow_2 {
    resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;
    # The redirect may be relative ("/live.ts?x=1"): add the address of the server that sent it
    set $proxy_target $upstream_http_location;
    if ($proxy_target ~ ^/) { set $proxy_target $proxy_origin$proxy_target; }
    if ($proxy_target ~ ^(https?://[^/]+)) { set $proxy_origin $1; }
    proxy_pass $proxy_target;
    include /etc/nginx/stream-proxy-common.conf;
    error_page 301 302 303 307 308 = @proxy_follow_3;
    error_page 400 401 402 403 404 405 406 408 410 429 500 501 502 503 504 = @proxy_failed;
}

location @proxy_follow_3 {
    resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;
    # The redirect may be relative ("/live.ts?x=1"): add the address of the server that sent it
    set $proxy_target $upstream_http_location;
    if ($proxy_target ~ ^/) { set $proxy_target $proxy_origin$proxy_target; }
    if ($proxy_target ~ ^(https?://[^/]+)) { set $proxy_origin $1; }
    proxy_pass $proxy_target;
    include /etc/nginx/stream-proxy-common.conf;
    # A fourth redirect would hand the provider address to the viewer in a Location header
    error_page 301 302 303 307 308 = @proxy_failed;
    error_page 400 401 402 403 404 405 406 408 410 429 500 501 502 503 504 = @proxy_failed;
}

location @proxy_failed {
    internal;
    default_type text/plain;
    return 502 "The provider could not be reached";
}
