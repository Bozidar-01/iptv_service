# Shared by the locations in stream-proxy.conf: how nginx talks to the provider
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header User-Agent $proxy_ua;
proxy_set_header Referer $proxy_referer;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header X-Forwarded-For "";

proxy_ssl_server_name on;
proxy_buffering off;
proxy_connect_timeout 8s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Provider errors (403, 404, 5xx...) are replaced by a plain one in stream-proxy.conf: its error page names the provider
proxy_intercept_errors on;

# The viewer must learn nothing about the provider
proxy_hide_header Set-Cookie;
proxy_hide_header Server;
proxy_hide_header X-Powered-By;
proxy_hide_header Location;
proxy_hide_header Via;
proxy_hide_header Link;
proxy_hide_header Content-Location;
proxy_hide_header Alt-Svc;
proxy_hide_header Refresh;
proxy_hide_header WWW-Authenticate;
proxy_hide_header Content-Disposition;
proxy_hide_header X-Cache;
proxy_hide_header X-Cache-Lookup;
proxy_hide_header X-Served-By;
add_header X-Accel-Buffering no;
add_header Cache-Control "no-store";
