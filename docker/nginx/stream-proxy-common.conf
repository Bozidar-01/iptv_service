# Shared by the locations in stream-proxy.conf: how nginx talks to the provider
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header User-Agent $proxy_ua;
proxy_set_header Referer $proxy_referer;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header X-Forwarded-For "";

proxy_ssl_server_name on;
proxy_buffering off;
proxy_connect_timeout 8s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Errors from the provider (404, 403...) are passed on as they are, but never its redirect target
proxy_intercept_errors on;

# The viewer must learn nothing about the provider
proxy_hide_header Set-Cookie;
proxy_hide_header Server;
proxy_hide_header X-Powered-By;
proxy_hide_header Location;
add_header X-Accel-Buffering no;
add_header Cache-Control "no-store";
