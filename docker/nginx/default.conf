server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Every .php URL runs Laravel's front controller: the Xtream Codes API lives at
    # /player_api.php, /get.php and /xmltv.php, which are routes, not files.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 300;
    }

    # Laravel routes like /playlist/{token}.m3u must reach PHP, not be served as files
    location ~ /\.(?!well-known) {
        deny all;
    }
}
