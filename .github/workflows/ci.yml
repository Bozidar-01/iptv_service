name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    # Checks run on pull requests (and on the staging branch). Not again on main: main only receives pull requests whose
    # checks passed on exactly this code (branch protection: up to date + required checks), so a second run changes nothing.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, zip, pcntl, bcmath, mbstring
          coverage: none

      - uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  quality:
    name: Code style and static analysis
    # Checks run on pull requests (and on the staging branch). Not again on main: main only receives pull requests whose
    # checks passed on exactly this code (branch protection: up to date + required checks), so a second run changes nothing.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, zip, pcntl, bcmath, mbstring
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  browser:
    name: Browser tests
    # Checks run on pull requests (and on the staging branch). Not again on main: main only receives pull requests whose
    # checks passed on exactly this code (branch protection: up to date + required checks), so a second run changes nothing.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, zip, pcntl, bcmath, mbstring
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci --ignore-scripts
      # Uses the Google Chrome that comes with the runner (playwright.config.js: channel "chrome")
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  mysql:
    name: Migrations on MySQL
    # Checks run on pull requests (and on the staging branch). Not again on main: main only receives pull requests whose
    # checks passed on exactly this code (branch protection: up to date + required checks), so a second run changes nothing.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: iptv_service
          MYSQL_USER: iptv
          MYSQL_PASSWORD: iptv
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: iptv_service
      DB_USERNAME: iptv
      DB_PASSWORD: iptv
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, zip, pcntl, bcmath, mbstring
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      # Up, all the way down, and up again: catches foreign-key / index mistakes SQLite allows
      - run: php artisan migrate --force
      - run: php artisan migrate:reset --force
      - run: php artisan migrate --force
      - run: php artisan db:seed --force
      - name: Back up, then restore the dump into a scratch database
        run: |
          php artisan iptv:backup
          file=$(ls storage/app/private/backups/*.sql.gz | tail -1)
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE restore_check"
          gunzip -c "$file" | mysql -h 127.0.0.1 -uroot -proot restore_check
          test "$(mysql -h 127.0.0.1 -uroot -proot -N -e 'SELECT COUNT(*) FROM restore_check.users')" -ge 1

  relay:
    name: Receiver relay
    # Checks run on pull requests (and on the staging branch). Not again on main: main only receives pull requests whose
    # checks passed on exactly this code (branch protection: up to date + required checks), so a second run changes nothing.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 relay/test_relay.py

  # Puts the merged commit on the server, right after a pull request (whose checks all passed) is merged into
  # main. Needs the secrets listed in docs/deployment.md#automatic-deploy; without them it does nothing.
  deploy:
    name: Deploy to the server
    # No `needs`: the checks ran on the pull request. A push to main can only be a merged pull request (branch protection).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time; a newer push waits for the running one instead of cutting it off half way
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v7

      - name: Is deploying set up?
        id: config
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_PATH" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploying is not set up (secrets missing): skipping. See docs/deployment.md#automatic-deploy"
          fi

      - name: Update the server
        if: steps.config.outputs.configured == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The script is sent from this checkout, so the server runs the version being deployed
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$DEPLOY_PATH' '$GITHUB_SHA'" < scripts/deploy.sh

  # Same checks, then the commit goes to the staging copy of the site (a separate subdomain and database) so a
  # change can be tried for real before it is merged. Push a branch there with:  git push -f origin <branch>:staging
  # Needs the DEPLOY_* secrets and STAGING_PATH (the staging project folder); without STAGING_PATH it does nothing.
  deploy-staging:
    name: Deploy to staging
    needs: [tests, quality, browser, mysql, relay]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      STAGING_PATH: ${{ secrets.STAGING_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v7

      - name: Is staging set up?
        id: config
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$STAGING_PATH" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Staging is not set up (STAGING_PATH or deploy secrets missing): skipping. See docs/deployment.md#staging"
          fi

      - name: Update staging
        if: steps.config.outputs.configured == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_RESET=1 bash -s -- '$STAGING_PATH' '$GITHUB_SHA' staging" < scripts/deploy.sh
